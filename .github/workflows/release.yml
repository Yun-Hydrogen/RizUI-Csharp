name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows & Linux)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content "dotnet/Directory.Build.props")
          $ver = $xml.Project.PropertyGroup.Version
          if (-not $ver) { $ver = "29.09.01" }
          Write-Host "Detected Version: $ver"
          "VERSION=$ver" >> $env:GITHUB_ENV
          "TAG_NAME=v$ver" >> $env:GITHUB_ENV

      - name: Pack RizUI.Uwp (Cross-Platform NuGet)
        run: |
          dotnet pack dotnet/RizUI.Uwp/RizUI.Uwp.csproj -c Release -o ./release-assets

      - name: Publish Demo for Windows (Single-File)
        run: |
          dotnet publish dotnet/RizUI.Demo/RizUI.Demo/RizUI.Demo.csproj -c Release -f net10.0-desktop -r win-x64 -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true --self-contained true -o ./demo-win
          Copy-Item ./demo-win/RizUI.Demo.exe ./release-assets/RizUI.Demo-win-x64.exe

      - name: Publish Demo for Linux (Single-File)
        run: |
          dotnet publish dotnet/RizUI.Demo/RizUI.Demo/RizUI.Demo.csproj -c Release -f net10.0-desktop -r linux-x64 -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true --self-contained true -o ./demo-linux
          Copy-Item ./demo-linux/RizUI.Demo ./release-assets/RizUI.Demo-linux-x64

      - name: List Release Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path ./release-assets | Select-Object Name, Length

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: RizUI Release ${{ env.TAG_NAME }}
          body: |
            ## 🚀 更新说明 / Commit Message
            ${{ github.event.head_commit.message }}

            ---
            ### 📦 产物说明 (Release Assets)
            - **`RizUI.Uwp.*.nupkg`**：跨平台通用组件库包（Windows / Linux / macOS / Android / iOS / WebAssembly 通用，无需区分系统）。
            - **`RizUI.Demo-win-x64.exe`**：Windows x64 独立单文件 Demo 程序（自包含运行环境，免安装即开即用）。
            - **`RizUI.Demo-linux-x64`**：Linux x64 独立单文件 Demo 程序（自包含运行环境，`chmod +x` 即可直接运行）。

            **Commit**: `${{ github.sha }}`
          files: |
            ./release-assets/*.nupkg
            ./release-assets/RizUI.Demo-win-x64.exe
            ./release-assets/RizUI.Demo-linux-x64
          draft: false
          prerelease: false
