name: Build and Release to GitHub Releases

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify .NET Environment
        run: dotnet --info

      - name: Restore Dependencies
        run: dotnet restore dotnet/RizUI.Uwp/RizUI.Uwp.csproj

      - name: Build & Pack RizUI.Uwp (Release)
        run: |
          dotnet pack dotnet/RizUI.Uwp/RizUI.Uwp.csproj -c Release -o ./artifacts

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: false
